version: 2

workflow: workflow.yaml

conversation:
  model:
    id: openai/gpt-5.6-sol
    reasoning: high

paths:
  allowed:
    - "**"
  protected:
    - ".github/workflows/**"

merge:
  mode: automatic
  method: merge

permissions:
  operators:
    repository_permissions:
      - admin
      - maintain
      - write
    users: []
    teams: []

instructions:
  project: prompts/project.md

validation:
  commands:
    - name: repository checks
      run:
        - pnpm
        - check

development_environment: {}
