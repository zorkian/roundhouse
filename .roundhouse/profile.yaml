version: 2

workflow: workflow.yaml

paths:
  allowed:
    - "**"
  protected:
    - ".github/workflows/**"

merge:
  mode: automatic
  method: merge

permissions:
  operators:
    repository_permissions:
      - admin
      - maintain
      - write
    users: []
    teams: []

instructions:
  project: prompts/project.md

reviewers:
  holistic:
    enabled: true
    model:
      id: openai/gpt-5.6-sol
      reasoning: low
    instructions: prompts/review-holistic.md
    blocking_severities:
      - critical
      - high
      - medium
  security:
    enabled: true
    selected_by: holistic
    model:
      id: openai/gpt-5.6-sol
      reasoning: low
    instructions: prompts/review-security.md
    blocking_severities:
      - critical
      - high
      - medium
  data:
    enabled: true
    selected_by: holistic
    model:
      id: openai/gpt-5.6-sol
      reasoning: low
    instructions: prompts/review-data.md
    blocking_severities:
      - critical
      - high
      - medium

validation:
  commands:
    - name: repository checks
      run:
        - pnpm
        - check

development_environment: {}
