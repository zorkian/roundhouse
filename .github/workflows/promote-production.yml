name: Promote production

on:
  workflow_dispatch:
    inputs:
      development_run_id:
        description: Successful CI run ID whose development deployment should be promoted
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: roundhouse-production
  cancel-in-progress: false

jobs:
  verify_development:
    name: Verify development deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.receipt.outputs.source_commit }}

    steps:
      - name: Validate run ID
        env:
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
        run: |
          if ! [[ "$DEVELOPMENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "development_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          fi

      - name: Download development deployment receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roundhouse-v2-development-${{ inputs.development_run_id }}
          path: ${{ runner.temp }}/development-receipt
          github-token: ${{ github.token }}
          run-id: ${{ inputs.development_run_id }}

      - name: Verify development deployment receipt
        id: receipt
        env:
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RECEIPT="$RUNNER_TEMP/development-receipt/development-deployment.json"
          HEAD_COMMIT="$(jq -er '.pullRequestHeadCommit | select(test("^[0-9a-f]{40}$"))' "$RECEIPT")"
          SOURCE_COMMIT="$(jq -er '.sourceCommit | select(test("^[0-9a-f]{40}$"))' "$RECEIPT")"

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$DEVELOPMENT_RUN_ID" \
            '.schemaVersion == 1 and
             .environment == "roundhouse-development" and
             .repository == $repository and
             .workflowRunId == $runId' \
            "$RECEIPT" > /dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEVELOPMENT_RUN_ID" \
            --jq '{name, path, event, conclusion, head_sha}' \
            > "$RUNNER_TEMP/development-run.json"
          jq -e \
            --arg headCommit "$HEAD_COMMIT" \
            '.name == "CI" and
             .path == ".github/workflows/ci.yml" and
             .event == "pull_request" and
             .conclusion == "success" and
             .head_sha == $headCommit' \
            "$RUNNER_TEMP/development-run.json" > /dev/null

          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

  deploy_production:
    name: Deploy production
    needs: verify_development
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: roundhouse-production

    steps:
      - name: Check out exact development deployment
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify_development.outputs.source_commit }}

      - name: Verify commit is on main
        env:
          SOURCE_COMMIT: ${{ needs.verify_development.outputs.source_commit }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check exact production candidate
        run: pnpm check

      - name: Build production candidate
        run: pnpm build

      - name: Render production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_V2_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_V2_D1_DATABASE_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          ROUNDHOUSE_GITHUB_APP_ID: ${{ vars.ROUNDHOUSE_GITHUB_APP_ID }}
          ROUNDHOUSE_GITHUB_CLIENT_ID: ${{ vars.ROUNDHOUSE_GITHUB_CLIENT_ID }}
        run: pnpm render:production-config

      - name: Verify retained production GitHub App secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler secret list \
            --env production \
            --config apps/control-plane/wrangler.production.jsonc \
            > "$RUNNER_TEMP/control-plane-secrets-before-deploy.json"
          jq -e \
            '([.[].name] | index("ROUNDHOUSE_GITHUB_APP_PRIVATE_KEY")) != null and
             ([.[].name] | index("ROUNDHOUSE_GITHUB_WEBHOOK_SECRET")) != null' \
            "$RUNNER_TEMP/control-plane-secrets-before-deploy.json" \
            > /dev/null

      - name: Write deployment secret files
        env:
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          AI_GATEWAY_TOKEN: ${{ secrets.ROUNDHOUSE_AI_GATEWAY_TOKEN }}
          CALLBACK_SIGNING_SECRET: ${{ secrets.ROUNDHOUSE_CALLBACK_SIGNING_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_SECRET: ${{ secrets.ROUNDHOUSE_GITHUB_CLIENT_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.ROUNDHOUSE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.ROUNDHOUSE_R2_SECRET_ACCESS_KEY }}
        run: |
          for name in \
            ACCESS_CLIENT_ID \
            ACCESS_CLIENT_SECRET \
            AI_GATEWAY_TOKEN \
            CALLBACK_SIGNING_SECRET \
            CLOUDFLARE_API_TOKEN \
            GITHUB_CLIENT_SECRET \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Required production secret $name is empty" >&2
              exit 1
            fi
          done

          umask 077
          jq -n \
            --arg AI_GATEWAY_TOKEN "$AI_GATEWAY_TOKEN" \
            '{AI_GATEWAY_TOKEN: $AI_GATEWAY_TOKEN}' \
            > "$RUNNER_TEMP/model-broker-secrets.json"
          jq -n \
            --arg CALLBACK_SIGNING_SECRET "$CALLBACK_SIGNING_SECRET" \
            '{CALLBACK_SIGNING_SECRET: $CALLBACK_SIGNING_SECRET}' \
            > "$RUNNER_TEMP/runtime-host-secrets.json"
          jq -n \
            --arg CALLBACK_SIGNING_SECRET "$CALLBACK_SIGNING_SECRET" \
            --arg R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID" \
            --arg R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY" \
            --arg ROUNDHOUSE_GITHUB_CLIENT_SECRET "$GITHUB_CLIENT_SECRET" \
            '{CALLBACK_SIGNING_SECRET: $CALLBACK_SIGNING_SECRET,
              R2_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID,
              R2_SECRET_ACCESS_KEY: $R2_SECRET_ACCESS_KEY,
              ROUNDHOUSE_GITHUB_CLIENT_SECRET: $ROUNDHOUSE_GITHUB_CLIENT_SECRET}' \
            > "$RUNNER_TEMP/control-plane-secrets.json"

      - name: Deploy model broker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --env production \
            --config apps/model-broker/wrangler.production.jsonc \
            --secrets-file "$RUNNER_TEMP/model-broker-secrets.json" \
            --strict

      - name: Deploy runtime host
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --env production \
            --config apps/runtime-host/wrangler.production.jsonc \
            --secrets-file "$RUNNER_TEMP/runtime-host-secrets.json" \
            --containers-rollout immediate \
            --strict

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler d1 migrations apply roundhouse-v2-production \
            --env production \
            --remote \
            --config apps/control-plane/wrangler.production.jsonc

      - name: Deploy control plane and cut over production hostname
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --env production \
            --config apps/control-plane/wrangler.production.jsonc \
            --secrets-file "$RUNNER_TEMP/control-plane-secrets.json" \
            --strict

      - name: Verify production health
        env:
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            https://roundhouse.rm-rf.rip/health \
            > "$RUNNER_TEMP/production-health.json"
          jq -e \
            '.ok == true and .service == "roundhouse-v2-control-plane"' \
            "$RUNNER_TEMP/production-health.json" > /dev/null

      - name: Record production deployment
        env:
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          SOURCE_COMMIT: ${{ needs.verify_development.outputs.source_commit }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg developmentRunId "$DEVELOPMENT_RUN_ID" \
            --arg productionRunId "$GITHUB_RUN_ID" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, environment: "roundhouse-production", repository: $repository, sourceCommit: $sourceCommit, developmentRunId: $developmentRunId, productionRunId: $productionRunId, deployedAt: $deployedAt}' \
            > "$RUNNER_TEMP/production-deployment.json"

      - name: Upload production deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roundhouse-v2-production-${{ github.run_id }}
          path: ${{ runner.temp }}/production-deployment.json
          if-no-files-found: error
          retention-days: 90
