name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  deploy-production:
    name: Deploy production
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: roundhouse-production
    concurrency:
      group: roundhouse-production
      cancel-in-progress: false

    steps:
      - name: Check out production commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production candidate
        run: pnpm build

      - name: Render production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_V2_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_V2_D1_DATABASE_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          ROUNDHOUSE_GITHUB_APP_ID: ${{ vars.ROUNDHOUSE_GITHUB_APP_ID }}
          ROUNDHOUSE_GITHUB_CLIENT_ID: ${{ vars.ROUNDHOUSE_GITHUB_CLIENT_ID }}
        run: pnpm render:production-config

      - name: Verify required deployment credentials
        env:
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for name in ACCESS_CLIENT_ID ACCESS_CLIENT_SECRET CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Required production secret $name is empty" >&2
              exit 1
            fi
          done

      - name: Verify retained production Worker state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CONTROL_PLANE_VERSION_ID="$(
            pnpm exec wrangler deployments status \
              --env production \
              --config apps/control-plane/wrangler.production.jsonc \
              --json \
              | jq -er \
                '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id'
          )"
          pnpm exec wrangler versions view "$CONTROL_PLANE_VERSION_ID" \
            --env production \
            --config apps/control-plane/wrangler.production.jsonc \
            --json \
            | jq -e \
              '(.resources.script_runtime.migration_tag |
                IN("execution-container-v1", "v2-production-control-plane-cutover")) and
               ([.resources.bindings[] | select(.type == "secret_text") | .name] |
                 index("ROUNDHOUSE_GITHUB_APP_PRIVATE_KEY") != null and
                 index("ROUNDHOUSE_GITHUB_WEBHOOK_SECRET") != null)' \
            > /dev/null

      - name: Verify Cloudflare-hosted production secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/verify-production-secrets.mjs \
            apps/control-plane/wrangler.production.jsonc \
            apps/runtime-host/wrangler.production.jsonc \
            apps/model-broker/wrangler.production.jsonc

      - name: Verify production commit is current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          CURRENT_MAIN_COMMIT="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ "$CURRENT_MAIN_COMMIT" != "$SOURCE_COMMIT" ]]; then
            echo "Refusing to deploy stale commit $SOURCE_COMMIT; main is $CURRENT_MAIN_COMMIT" >&2
            exit 1
          fi

      - name: Deploy model broker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --env production \
            --config apps/model-broker/wrangler.production.jsonc \
            --strict

      - name: Deploy runtime host
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --env production \
            --config apps/runtime-host/wrangler.production.jsonc \
            --containers-rollout immediate \
            --strict

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler d1 migrations apply roundhouse-v2-production \
            --env production \
            --remote \
            --config apps/control-plane/wrangler.production.jsonc

      - name: Deploy control plane
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --env production \
            --config apps/control-plane/wrangler.production.jsonc \
            --strict

      - name: Verify production health
        env:
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            https://roundhouse.rm-rf.rip/health \
            > "$RUNNER_TEMP/production-health.json"
          jq -e \
            '.ok == true and .service == "roundhouse-v2-control-plane"' \
            "$RUNNER_TEMP/production-health.json" > /dev/null

      - name: Record production deployment
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$RUN_ATTEMPT" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, environment: "roundhouse-production", repository: $repository, sourceCommit: $sourceCommit, workflowRunId: $workflowRunId, workflowRunAttempt: $workflowRunAttempt, deployedAt: $deployedAt}' \
            > "$RUNNER_TEMP/production-deployment.json"

      - name: Upload production deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roundhouse-v2-production-${{ github.run_id }}
          path: ${{ runner.temp }}/production-deployment.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
