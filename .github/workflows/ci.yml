name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # A delayed PR check must not cancel the merged-PR deployment.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'closed' && 'deploy' || 'check' }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  deploy-development:
    name: Deploy development
    needs: check
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: roundhouse-development

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployment
        run: pnpm build

      - name: Determine runtime deployment
        id: runtime
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          DIFF_BASE="$(git rev-parse "${MERGE_SHA}^1")"
          if git diff --quiet "$DIFF_BASE" "$MERGE_SHA" -- \
            Dockerfile.agent-runner \
            apps/runtime-host \
            apps/control-plane/src/attempt-container.ts \
            apps/control-plane/src/attempt-sandbox-components.ts \
            apps/control-plane/src/attempt-timeouts.ts \
            apps/control-plane/src/callback.ts \
            apps/control-plane/src/d1-store.ts \
            apps/control-plane/src/nested-container-runtime.ts \
            apps/control-plane/src/preview-transport.ts \
            apps/control-plane/src/runtime-host.ts \
            apps/control-plane/src/workspace-lifecycle.ts \
            containers/agent-runner \
            packages/core \
            packages/response-observer \
            package.json \
            pnpm-lock.yaml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo '{"message":"development_runtime_deploy_selected","needed":false}'
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo '{"message":"development_runtime_deploy_selected","needed":true}'
          fi

      - name: Deploy runtime host
        if: steps.runtime.outputs.needed == 'true'
        run: pnpm deploy:development:runtime

      - name: Deploy control plane
        run: pnpm deploy:development:control-plane

      - name: Record successful development deployment
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pullRequestHeadCommit "$HEAD_SHA" \
            --arg sourceCommit "$MERGE_SHA" \
            --arg workflowRunId "$RUN_ID" \
            --arg workflowRunAttempt "$RUN_ATTEMPT" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, environment: "roundhouse-development", repository: $repository, pullRequestHeadCommit: $pullRequestHeadCommit, sourceCommit: $sourceCommit, workflowRunId: $workflowRunId, workflowRunAttempt: $workflowRunAttempt, deployedAt: $deployedAt}' \
            > "$RUNNER_TEMP/development-deployment.json"

      - name: Upload development deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roundhouse-v2-development-${{ github.run_id }}
          path: ${{ runner.temp }}/development-deployment.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
